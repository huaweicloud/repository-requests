name: " 新建仓库申请"
description: "申请在 huaweicloud 组织下创建新仓库"
body:
  - type: markdown
    attributes:
      value: |
        ## 新建仓库申请
        huaweicloud 组织仓库创建申请

  - type: dropdown
    id: repo_type
    attributes:
      label: 仓库类型
      description: 选择仓库类型，决定初始化文件数量和模板
      options:
        - SDK
        - Terraform Provider
        - GitHub Action
        - 框架集成
        - Exporter / Plugin
        - IoT SDK
        - 示例 / Lab / Sample
        - 文档 / 数据集
        - 内部配置
    validations:
      required: true

  - type: input
    id: repo_name
    attributes:
      label: 仓库名称
      description: 小写字母、数字和连字符，≤100字符，不以连字符开头/结尾，无连续连字符
      placeholder: my-awesome-sdk
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 仓库描述
      description: 简要描述仓库用途
      placeholder: 该仓库用于...
    validations:
      required: true

  - type: dropdown
    id: visibility
    attributes:
      label: 可见性
      options:
        - public
        - private
      default: 0
    validations:
      required: true

  - type: dropdown
    id: license
    attributes:
      label: 开源许可证
      description: 仅产品项目使用用户选择，其余类型强制 Apache-2.0
      options:
        - Apache-2.0（推荐）
        - MIT
        - BSD-3-Clause
      default: 0
    validations:
      required: true

  - type: textarea
    id: topics
    attributes:
      label: Topics 标签（至少 3 个）
      description: 逗号或换行分隔，每个标签须匹配 [a-z0-9][a-z0-9.-]*
      placeholder: "sdk, api, python"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 仓库角色

  - type: textarea
    id: owner
    attributes:
      label: Owner（管理员，≥1 人）
      description: 拥有仓库完整管理权限的 GitHub 用户名，逗号或换行分隔
      placeholder: alice, bob
    validations:
      required: true

  - type: textarea
    id: maintainer
    attributes:
      label: Maintainer（维护者，≥1 人）
      description: 拥有维护权限的 GitHub 用户名，逗号或换行分隔
      placeholder: charlie, dave
    validations:
      required: true

  - type: textarea
    id: writer
    attributes:
      label: Writer（写入者）
      description: 拥有推送权限的 GitHub 用户名（可选），逗号或换行分隔
      placeholder: eve, frank

  - type: textarea
    id: justification
    attributes:
      label: 申请理由
      description: 为什么需要创建这个仓库？解决什么问题？目标用户是谁？
      placeholder: 该仓库用于...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认清单
      options:
        - label: 仓库名称符合命名规范（小写字母、数字、连字符，≤100字符）
          required: true
        - label: 我已确认组织内不存在同名仓库
          required: true
        - label: 以上填写的 Owner 和 Maintainer 均为组织成员
          required: true
        - label: Topics 标签不少于 3 个
          required: true
        - label: 我了解创建的仓库将遵循组织的社区治理规范
          required: true
