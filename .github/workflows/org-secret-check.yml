name: Org Secret Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check org secret
        run: |
          if [ -n "${{ secrets.BOT_TOKEN }}" ]; then echo "BOT_TOKEN AVAILABLE"; else echo "BOT_TOKEN MISSING"; fi
          if [ -n "${{ secrets.FEISHU_APP_ID }}" ]; then echo "FEISHU AVAILABLE"; else echo "FEISHU MISSING"; fi
