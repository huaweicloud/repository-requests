name: Repo Request Validation

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.body, '### 仓库名称') || contains(github.event.issue.body, '### Repository Name') || contains(github.event.issue.body, '### Repository Type')
    steps:
      - uses: actions/checkout@v4

      - name: Validate Repo Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}
        run: python3 scripts/repo_request_validator.py
