name: Org Secret Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test org secrets
        env:
          ORG_BOT: ${{ secrets.BOT_TOKEN }}
          ORG_FEISHU: ${{ secrets.FEISHU_APP_ID }}
        run: |
          echo "ORG_BOT length: ${#ORG_BOT}"
          echo "ORG_FEISHU length: ${#ORG_FEISHU}"
          if [ -n "$ORG_BOT" ]; then echo "BOT_TOKEN: AVAILABLE"; else echo "BOT_TOKEN: MISSING"; fi
