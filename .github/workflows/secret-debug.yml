name: Secret Debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        run: |
          if [ -n "${{ secrets.BOT_TOKEN }}" ]; then echo "BOT_TOKEN available"; else echo "BOT_TOKEN MISSING"; fi
          if [ -n "${{ secrets.FEISHU_APP_ID }}" ]; then echo "FEISHU_APP_ID available"; else echo "FEISHU_APP_ID MISSING"; fi
